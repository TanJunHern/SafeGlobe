<html lang="en"><head><meta charset="utf-8">

<title>Pond-Guard</title>

<style>
/* DueDilly "Pond" light theme. 640x1080 panel, 5.0 s, 30 fps. ?t=2.5 freezes at 2.5 s; press R to replay. */
:root{--bg:#FBF6E9;--surf:#FFFDF7;--surf2:#F4ECDA;--border:#EADFC4;--text:#2E2A33;--muted:#6B6573;--teal:#1F6F6B;
--red:#D9604F;--amber:#E0A23A;--green:#6E9F6A;--water:#DCEBE8}
html,body{margin:0;background:var(--bg)}
.stage{position:relative;width:640px;height:1080px;overflow:hidden;background:var(--bg)}
svg.main{position:absolute;inset:0}
.title{position:absolute;left:48px;top:58px;font:600 40px/1 'Fredoka',system-ui,sans-serif;letter-spacing:-0.01em;color:var(--text);
  animation:fadeUp .6s cubic-bezier(.2,.7,.2,1) .05s both}
.rule{position:absolute;left:48px;top:112px;height:4px;width:56px;border-radius:2px;background:var(--teal);transform-origin:left;
  animation:grow .5s ease .25s both}
.footer{position:absolute;left:0;right:0;top:996px;display:flex;justify-content:center;align-items:center;gap:26px;
  animation:fade .6s ease .3s both}
.lg{display:flex;align-items:center;gap:8px;font:500 15px 'Inter',system-ui,sans-serif;color:var(--muted)}
.lg i{font-style:normal}
.lg .fb{font:600 13px 'Inter',system-ui,sans-serif;color:var(--teal);border:1.5px solid var(--teal);border-radius:999px;padding:5px 10px}
.pill{font:600 14px 'Inter',system-ui,sans-serif;color:var(--teal);border:1.5px solid var(--teal);border-radius:999px;padding:6px 12px}
.lbl{font:500 15px 'Inter',system-ui,sans-serif;fill:var(--text)}
.mono{font:500 14px 'JetBrains Mono',ui-monospace,monospace;fill:var(--muted)}
.draw{stroke-dasharray:1;stroke-dashoffset:1}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes travel{0%{offset-distance:0%;opacity:0}12%{opacity:1}88%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes back{0%{offset-distance:100%;opacity:0}12%{opacity:1}88%{opacity:1}100%{offset-distance:0%;opacity:0}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:0}20%,80%{opacity:1}}
@keyframes ring{0%{opacity:.7;transform:scale(.6)}100%{opacity:0;transform:scale(1.6)}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.2,.8,.3,1.2) both}
.pk{offset-rotate:0deg}
@keyframes score{to{stroke-dashoffset:15}}
@property --n{syntax:'<integer>';initial-value:0;inherits:false}
.score{position:absolute;left:440px;top:262px;padding:8px 16px;border-radius:16px;background:#FFFDF7;border:2px solid #D9604F;font:600 40px/1 'Fredoka',system-ui,sans-serif;letter-spacing:-0.01em;color:#D9604F;counter-reset:n var(--n);animation:count .8s cubic-bezier(.3,.7,.2,1) 3.65s both, fadeUp .35s ease 3.65s both}.score::before{content:counter(n)}@keyframes count{from{--n:0}to{--n:85}}
</style>
<script>
function logoFail(img){
  if(img.dataset.remote && !img.dataset.tried){img.dataset.tried=1; img.src=img.dataset.remote; return;}
  img.hidden=true; const s=img.parentNode; s.querySelector('.fb').hidden=false; s.querySelector('i').hidden=true;
}
</script>
</head><body>

<script>
function seek(t){document.getAnimations().forEach(a=>{a.pause();a.currentTime=t*1000;});}
window.seek=seek;
const q=new URLSearchParams(location.search);
if(q.has('t')) seek(parseFloat(q.get('t')));
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')document.getAnimations().forEach(a=>{a.currentTime=0;a.play();});});
</script>
