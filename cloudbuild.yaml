# Google Cloud Build pipeline for DueDilly: builds the image and rolls it out to the existing Cloud Run service.
#
#   gcloud builds submit --config=cloudbuild.yaml
#
# Run `bash scripts/deploy.sh uat` once first. That first deploy sets the service account, the settings and
# the secrets; this pipeline only changes the image, so those stay as they are.
# Needs the Artifact Registry repository named in _REPO_NAME (created by the first `scripts/deploy.sh uat`).

steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:$BUILD_ID'
      - '.'

  # 2. Push it to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:$BUILD_ID'

  # 3. Roll the new image out. One instance only: the app keeps its data in SQLite on the instance's disk.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image'
      - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:$BUILD_ID'
      - '--region'
      - '$_LOCATION'
      - '--max-instances'
      - '1'

images:
  - '$_LOCATION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:$BUILD_ID'

substitutions:
  _LOCATION: 'asia-southeast1'
  _REPO_NAME: 'cloud-run-source-deploy'
  _SERVICE_NAME: 'duedilly-uat'

options:
  logging: CLOUD_LOGGING_ONLY
